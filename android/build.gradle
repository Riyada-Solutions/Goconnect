// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // notifee publishes app.notifee:core into a local maven repo inside its own
    // package. Its build.gradle registers that repo via rootProject.allprojects,
    // but `expo run:android` passes --configure-on-demand, so :app resolves its
    // classpath before :notifee_react-native is ever configured. Register it here
    // too so the local run matches what EAS (no configure-on-demand) already gets.
    maven { url "$rootDir/../node_modules/@notifee/react-native/android/libs" }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
